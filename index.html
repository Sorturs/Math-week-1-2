<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQAO Exam Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">EQAO Exam Simulator</h1>
            <p class="text-slate-500 mt-2">Mode: Full Practice Exam</p>
            <div id="progress" class="mt-4 text-sm font-semibold text-blue-600">Initializing...</div>
        </header>

        <div id="exam-container" class="space-y-6">
            <div id="question-box" class="p-6 bg-slate-50 rounded-xl border border-slate-200 text-lg font-medium text-slate-800 min-h-[120px] flex items-center justify-center">
                Loading question...
            </div>

            <input type="text" id="answer-input" placeholder="Type your answer here..." 
                   class="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <div id="feedback" class="hidden p-4 rounded-lg font-bold"></div>

            <div class="flex justify-between items-center gap-4">
                <button onclick="submitAnswer()" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition">Submit Answer</button>
                <button onclick="nextQuestion()" id="next-btn" class="hidden w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold transition">Next Question</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "What does 'm' represent in y = mx + b?", a: "Slope" },
            { q: "What is the formula for the sum of interior angles of a polygon with n sides?", a: "(n-2) * 180" },
            { q: "What is the Pythagorean Theorem?", a: "a² + b² = c²" },
            { q: "What is the slope of a line parallel to y = 2x + 5?", a: "2" },
            { q: "Expand 2(x + 3)", a: "2x + 6" },
            { q: "What is the quotient rule for exponents: x^a / x^b?", a: "x^(a - b)" },
            { q: "What is the product rule for exponents: x^a * x^b?", a: "x^(a + b)" },
            { q: "Evaluate 3^-2", a: "1/9" },
            { q: "Depreciation means the value of an item is...", a: "Decreasing" },
            { q: "How do you isolate y in 2x + y = 10?", a: "y = -2x + 10" },
            { q: "Area of a rectangle?", a: "l * w" },
            { q: "What is the slope of a perpendicular line to y = 1/2x?", a: "-2" },
            { q: "Sum of angles in a triangle?", a: "180" },
            { q: "BEDMAS stands for?", a: "Brackets Exponents Division Multiplication Addition Subtraction" }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startExam() {
            currentQuestions = shuffle(questions);
            currentIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('question-box').innerText = currentQuestions[currentIndex].q;
            document.getElementById('progress').innerText = `Question ${currentIndex + 1}/${currentQuestions.length}`;
            document.getElementById('answer-input').focus();
        }

        function submitAnswer() {
            const input = document.getElementById('answer-input').value.trim();
            const correct = currentQuestions[currentIndex].a;
            const feedback = document.getElementById('feedback');
            
            feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (input.toLowerCase() === correct.toLowerCase()) {
                feedback.innerText = "Correct!";
                feedback.classList.add('bg-green-100', 'text-green-800');
                score++;
            } else {
                feedback.innerText = `Incorrect. Correct answer: ${correct}`;
                feedback.classList.add('bg-red-100', 'text-red-800');
            }
            
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('submit-btn').classList.contains('hidden')) {
                    nextQuestion();
                } else {
                    submitAnswer();
                }
            }
        });

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                document.getElementById('exam-container').innerHTML = `<div class="text-center p-8">
                    <h2 class="text-2xl font-bold">Exam Complete!</h2>
                    <p class="mt-4 text-xl">Final Score: ${score}/${currentQuestions.length}</p>
                    <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-blue-600 text-white rounded-lg">Restart Exam</button>
                </div>`;
            }
        }

        window.onload = startExam;
    </script>
</body>
</html>
