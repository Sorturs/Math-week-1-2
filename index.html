<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQAO Cram-Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .transition-transform { transition: transform 0.6s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">EQAO Cram-Machine</h1>
            <p class="text-slate-500 mt-2">Cycle 1-7 Practice Module</p>
            <div id="progress" class="mt-4 text-sm font-semibold text-blue-600">Question 0/0</div>
        </header>

        <div id="game-container" class="perspective-1000 w-full h-64 mb-8 cursor-pointer group" onclick="flipCard()">
            <div id="card" class="relative w-full h-full text-center transition-transform preserve-3d">
                <!-- Front -->
                <div id="front" class="absolute w-full h-full bg-blue-500 text-white rounded-xl flex items-center justify-center p-6 backface-hidden shadow-lg">
                    <p class="text-xl font-medium">Loading...</p>
                </div>
                <!-- Back -->
                <div id="back" class="absolute w-full h-full bg-slate-800 text-white rounded-xl flex items-center justify-center p-6 backface-hidden rotate-y-180 shadow-lg">
                    <p class="text-lg">Answer loading...</p>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center gap-4">
            <button onclick="prevQuestion()" class="px-6 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold">Previous</button>
            <button onclick="startExam()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold">Reshuffle</button>
            <button onclick="nextQuestion()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">Next</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "What does 'm' represent in y = mx + b?", a: "Slope" },
            { q: "What is the formula for the sum of interior angles of a polygon with n sides?", a: "(n-2) × 180°" },
            { q: "What is the Pythagorean Theorem?", a: "a² + b² = c²" },
            { q: "What is the slope of a line parallel to y = 2x + 5?", a: "2" },
            { q: "What are the slopes of perpendicular lines?", a: "Negative reciprocals (e.g., 2 and -1/2)" },
            { q: "Expand 2(x + 3)", a: "2x + 6" },
            { q: "What is the quotient rule for exponents: x^a / x^b?", a: "x^(a - b)" },
            { q: "What is the product rule for exponents: x^a * x^b?", a: "x^(a + b)" },
            { q: "Evaluate 3^-2", a: "1/9 (or 0.111...)" },
            { q: "If the Point of Intersection (POI) is (2, 3), what does that mean?", a: "Both lines share the coordinates (2, 3)" },
            { q: "What is BEDMAS?", a: "Brackets, Exponents, Division, Multiplication, Addition, Subtraction" },
            { q: "Depreciation means the value of an item is...", a: "Decreasing over time" },
            { q: "How do you isolate y in 2x + y = 10?", a: "y = -2x + 10" },
            { q: "What is a rational number?", a: "A number that can be expressed as a fraction" },
            { q: "What is the area of a rectangle with sides l and w?", a: "Area = l * w" }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let isFlipped = false;

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startExam() {
            currentQuestions = shuffle(questions);
            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            isFlipped = false;
            document.getElementById('card').style.transform = 'rotateY(0deg)';
            document.getElementById('front').innerText = currentQuestions[currentIndex].q;
            document.getElementById('back').innerText = currentQuestions[currentIndex].a;
            document.getElementById('progress').innerText = `Question ${currentIndex + 1}/${currentQuestions.length}`;
        }

        function flipCard() {
            const card = document.getElementById('card');
            isFlipped = !isFlipped;
            card.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            }=`
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // Initialize on load
        window.onload = startExam;
    </script>
</body>
</html>
