<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEDMAS Speedrun v2.0: Hard Mode</title>
    <style>
        :root {
            --primary: #8e44ad; /* Changed to Purple for Hard Mode vibe */
            --secondary: #2c3e50;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        h1 { color: var(--secondary); margin-bottom: 0.5rem; font-size: 1.5rem;}
        .stats { display: flex; justify-content: space-around; margin-bottom: 1rem; font-weight: bold; color: #555; }
        
        #problem-box {
            background: var(--secondary);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            font-size: 2rem; /* Larger text for math */
            margin-bottom: 1.5rem;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace; /* Code font for math */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 1.3rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover { background: #732d91; transform: translateY(-2px); }

        #feedback-area {
            margin-top: 1.5rem;
            display: none; /* Hidden by default */
        }

        .feedback-card {
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct { background: #d4edda; color: #155724; border-left: 5px solid var(--success); }
        .incorrect { background: #fadbd8; color: #721c24; border-left: 5px solid var(--danger); }
        
        .syntax-tip {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 2rem;
            font-style: italic;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            background-color: #ddd;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

    </style>
</head>
<body>

<div class="game-container">
    <h1>BEDMAS: The Gauntlet</h1>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="stats">
        <span>XP: <span id="score">0</span></span>
        <span>Streak: <span id="streak">0</span></span>
    </div>

    <div id="game-area">
        <div id="problem-box">Loading...</div>
        
        <input type="number" id="answer-input" placeholder="?" onkeydown="if(event.key === 'Enter') checkAnswer()">
        <br>
        <button onclick="checkAnswer()">Execute Code</button>
    </div>

    <div id="feedback-area"></div>

    <p class="syntax-tip">Tip: (-3)² is 9. But -3² is -9.</p>
</div>

<script>
    // The "Level Data" - Includes the original 4 plus 5 Hard Mode Exponents
    const questions = [
        // --- LEVEL 1: The Warmup ---
        {
            q: "-20 + (3 × 15)",
            a: 25,
            level: "Basic",
            steps: "1. Brackets: (3 × 15) = 45.<br>2. Add: -20 + 45.<br>3. Think: Debt of 20, paid 45. Surplus 25."
        },
        {
            q: "10 - 2 × 3 + 1",
            a: 5,
            level: "Basic",
            steps: "1. Mult first: 2 × 3 = 6.<br>2. Rewrite: 10 - 6 + 1.<br>3. L-to-R: 10 - 6 = 4.<br>4. Finish: 4 + 1 = 5."
        },
        {
            q: "(-4 × 2) + (15 ÷ 3) - (-2)",
            a: -1,
            level: "Intermediate",
            steps: "1. Brackets: (-8) + (5) - (-2).<br>2. Double Negative: -(-2) becomes +2.<br>3. Combine: -8 + 5 + 2.<br>4. -3 + 2 = -1."
        },
        {
            q: "12 ÷ (2 + 4) × 5",
            a: 10,
            level: "Intermediate",
            steps: "1. Brackets: (2+4) = 6.<br>2. Rewrite: 12 ÷ 6 × 5.<br>3. L-to-R: 12 ÷ 6 = 2.<br>4. Finish: 2 × 5 = 10."
        },
        
        // --- LEVEL 2: HARD MODE (Exponents) ---
        {
            q: "(-5)² + (-2)³",
            a: 17,
            level: "Hard Mode",
            steps: "1. (-5)²: Negative is inside brackets. -5 × -5 = 25.<br>2. (-2)³: -2 × -2 × -2 = -8.<br>3. Rewrite: 25 + (-8).<br>4. Result: 17."
        },
        {
            q: "7⁰ + 5 × 2²",
            a: 21,
            level: "Hard Mode",
            steps: "1. Exponents first! 7⁰ is ALWAYS 1.<br>2. 2² is 4.<br>3. Rewrite: 1 + 5 × 4.<br>4. Mult: 5 × 4 = 20.<br>5. Add: 1 + 20 = 21."
        },
        {
            q: "2(3² - 10) + 4",
            a: 2,
            level: "Hard Mode",
            steps: "1. Inside Brackets (Exp): 3² = 9.<br>2. Inside Brackets (Sub): 9 - 10 = -1.<br>3. Rewrite: 2(-1) + 4.<br>4. Mult: -2 + 4 = 2."
        },
        {
            q: "(10 - 2)² ÷ 4",
            a: 16,
            level: "Hard Mode",
            steps: "1. Brackets: (10 - 2) = 8.<br>2. Exponent: 8² = 64.<br>3. Division: 64 ÷ 4 = 16."
        },
        {
            q: "-3² + (-3)²",
            a: 0,
            level: "BOSS BATTLE",
            steps: "1. The TRAP: -3² has NO brackets. It means -(3×3) = -9.<br>2. The SAFETY: (-3)² has brackets. It means -3 × -3 = +9.<br>3. Combine: -9 + 9 = 0."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let streak = 0;

    function loadQuestion() {
        const gameArea = document.getElementById('game-area');
        const feedbackArea = document.getElementById('feedback-area');
        const progressBar = document.getElementById('progress-bar');

        // Reset UI
        feedbackArea.style.display = 'none';
        feedbackArea.innerHTML = '';
        gameArea.style.display = 'block';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        // Check for Win
        if(currentIdx >= questions.length) {
            gameArea.innerHTML = `
                <h2>🎉 COURSE COMPLETE 🎉</h2>
                <p>Final XP: ${score} / ${questions.length}</p>
                <p>Max Streak: ${streak}</p>
                <button onclick="location.reload()">Prestige (Restart)</button>
            `;
            progressBar.style.width = '100%';
            return;
        }

        // Load Question
        const q = questions[currentIdx];
        document.getElementById('problem-box').innerHTML = `
            <span style="font-size: 0.5em; display:block; color: #bdc3c7; margin-bottom: 10px;">${q.level}</span>
            ${q.q}
        `;
        
        // Update Progress
        const percent = (currentIdx / questions.length) * 100;
        progressBar.style.width = `${percent}%`;
    }

    function checkAnswer() {
        const userAns = parseInt(document.getElementById('answer-input').value);
        const feedbackArea = document.getElementById('feedback-area');
        const currentQ = questions[currentIdx];
        const gameArea = document.getElementById('game-area');

        // Simple validation
        if (isNaN(userAns)) return;

        // Hide input area temporarily
        gameArea.style.display = 'none';
        feedbackArea.style.display = 'block';

        let isCorrect = userAns === currentQ.a;
        let feedbackHTML = '';

        if(isCorrect) {
            score++;
            streak++;
            feedbackHTML = `
                <div class="feedback-card correct">
                    <h3>✅ Correct!</h3>
                    <p>${currentQ.steps}</p>
                    <button onclick="nextQuestion()">Next Level >></button>
                </div>
            `;
        } else {
            streak = 0;
            feedbackHTML = `
                <div class="feedback-card incorrect">
                    <h3>❌ Syntax Error</h3>
                    <p><strong>Your answer:</strong> ${userAns}</p>
                    <p><strong>Correct answer:</strong> ${currentQ.a}</p>
                    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1);">
                    <p>${currentQ.steps}</p>
                    <button onclick="nextQuestion()">Try Again >></button>
                </div>
            `;
        }

        feedbackArea.innerHTML = feedbackHTML;
        
        // Update Stats
        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    // Start Game
    loadQuestion();
</script>

</body>
</html>
