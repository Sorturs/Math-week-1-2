<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Speedrun v4.0: Real Numbers</title>
    <style>
        :root {
            --primary: #0984e3; /* Changed to Blue for Logic/Real Numbers */
            --secondary: #2d3436;
            --accent: #00cec9;
            --success: #00b894;
            --danger: #d63031;
            --bg: #dfe6e9;
            --tile-red: #ff7675;
            --tile-blue: #74b9ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 550px;
            text-align: center;
            border-top: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        h1 { color: var(--secondary); margin-bottom: 0.5rem; font-size: 1.8rem; letter-spacing: -1px;}
        .stats { display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-weight: 700; color: #636e72; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;}
        
        #problem-box {
            background: var(--secondary);
            color: var(--accent);
            padding: 2rem;
            border-radius: 12px;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            border: 2px solid #b2bec3;
            transition: transform 0.1s;
            flex-direction: column;
        }

        .shake { animation: shake 0.5s; }
        .pulse { animation: pulse 0.3s; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px var(--success); }
            100% { transform: scale(1); }
        }

        input {
            width: 60%;
            padding: 15px;
            font-size: 1.5rem;
            border: 3px solid #dfe6e9;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover { background: #74b9ff; transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.15); }

        #feedback-area {
            margin-top: 1.5rem;
            display: none;
        }

        .feedback-card {
            padding: 1.5rem;
            border-radius: 12px;
            text-align: left;
            line-height: 1.6;
            animation: slideUp 0.3s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct { background: #dff9fb; color: #009432; border: 2px solid var(--success); }
        .incorrect { background: #ff7675; color: white; border: 2px solid var(--danger); }
        .incorrect h3 { color: white; }
        .incorrect hr { border-color: rgba(255,255,255,0.3); }
        
        .syntax-tip {
            font-size: 0.85rem;
            color: #b2bec3;
            margin-top: 2rem;
            font-style: italic;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .level-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .lvl-basic { background: #ffeaa7; color: #d35400; }
        .lvl-hard { background: #a29bfe; color: #2d3436; }
        .lvl-tiles { background: #fab1a0; color: #2d3436; }
        .lvl-numline { background: #74b9ff; color: #2d3436; }
        .lvl-real { background: #6c5ce7; color: white; }

        /* Tile Visuals for Feedback */
        .tile {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin: 0 2px;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .t-red { background-color: var(--tile-red); }
        .t-blue { background-color: var(--tile-blue); }

    </style>
</head>
<body>

<div class="game-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>MATH SPEEDRUN</h1>
        <span style="font-size:0.8rem; color:#b2bec3;">v4.0</span>
    </div>
    
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="stats">
        <span>LVL: <span id="level-display">1</span></span>
        <span>XP: <span id="score">0</span></span>
        <span>Streak: <span id="streak">0</span></span>
    </div>

    <div id="game-area">
        <div id="problem-box">Loading...</div>
        
        <input type="number" step="0.01" id="answer-input" placeholder="?" onkeydown="if(event.key === 'Enter') checkAnswer()">
        <br>
        <button onclick="checkAnswer()">EXECUTE</button>
    </div>

    <div id="feedback-area"></div>

    <p class="syntax-tip" id="tip-text">Tip: Multiplication comes before Addition.</p>
</div>

<script>
    // Helper to generate tile HTML string
    const drawTiles = (count, color) => {
        let html = '';
        const cClass = color === 'red' ? 't-red' : 't-blue';
        for(let i=0; i<Math.abs(count); i++) html += `<span class="tile ${cClass}"></span>`;
        return html;
    };

    const questions = [
        // --- LEVEL 1: BEDMAS FUNDAMENTALS ---
        {
            q: "10 - 2 × 3",
            a: 4,
            level: "Basic",
            style: "lvl-basic",
            steps: "1. <strong>Multiply First:</strong> 2 × 3 = 6.<br>2. <strong>Subtract:</strong> 10 - 6 = 4.<br><em>(Trap: Don't do 10-2 first!)</em>"
        },
        {
            q: "−5 + (10 ÷ 2)",
            a: 0,
            level: "Basic",
            style: "lvl-basic",
            steps: "1. <strong>Brackets:</strong> 10 ÷ 2 = 5.<br>2. <strong>Add:</strong> -5 + 5 = 0.<br><em>(Zero Pair!)</em>"
        },
        
        // --- LEVEL 2: INTEGERS & EXPONENTS ---
        {
            q: "-3² + 5",
            a: -4,
            level: "Hard Mode",
            style: "lvl-hard",
            steps: "1. <strong>Exponent Trap:</strong> -3² has NO brackets. It means -(3×3) = -9.<br>2. <strong>Add:</strong> -9 + 5 = -4."
        },

        // --- LEVEL 3: INTEGER TILES ---
        {
            q: "Tile Check:<br>1 Blue minus 3 Red",
            a: -4,
            level: "Integer Tiles",
            style: "lvl-tiles",
            steps: `1. <strong>Start:</strong> ${drawTiles(1, 'blue')}<br>
                    2. <strong>Borrowing:</strong> Add 3 Zero Pairs (${drawTiles(3, 'red')}${drawTiles(3, 'blue')}).<br>
                    3. <strong>Action:</strong> Take 3 Reds away.<br>
                    4. <strong>Result:</strong> ${drawTiles(4, 'blue')} (-4).`
        },
        {
            q: "Syntax Boss:<br>2 - (-4)",
            a: 6,
            level: "Tile Mastery",
            style: "lvl-tiles",
            steps: `1. <strong>Teleport Rule:</strong> Two negatives make a positive (+).<br>
                    2. <strong>Rewrite:</strong> 2 + 4<br>
                    3. <strong>Result:</strong> ${drawTiles(6, 'red')} (6).`
        },

        // --- LEVEL 4: THE NUMBER LINE (Decimals) ---
        {
            q: "Convert to Decimal:<br>3/5",
            a: 0.6,
            level: "Number Line",
            style: "lvl-numline",
            steps: "1. <strong>Fraction Rule:</strong> Top ÷ Bottom.<br>2. <strong>Calc:</strong> 3 ÷ 5 = 0.6."
        },
        {
            q: "Convert to Decimal:<br>110%",
            a: 1.1,
            level: "Number Line",
            style: "lvl-numline",
            steps: "1. <strong>Percent Rule:</strong> Move decimal 2 spots left.<br>2. <strong>Calc:</strong> 1.10"
        },
        {
            q: "<strong>The Trap:</strong><br>Enter the <em>smaller</em> number:<br>-1.5 or -2.0",
            a: -2,
            level: "Number Line",
            style: "lvl-numline",
            steps: "1. <strong>Negative Rule:</strong> The number <em>further from zero</em> is smaller.<br>2. <strong>Compare:</strong> -2 is deeper in debt than -1.5."
        },
        {
            q: "<strong>Hat Trick:</strong><br>Calc 4th Root of 2 (√[4] 2)<br>(Round to 2 decimals)",
            a: 1.19,
            level: "Number Line",
            style: "lvl-numline",
            steps: "1. <strong>Syntax:</strong> 4 -> Shift -> Hat -> 2.<br>2. <strong>Calc:</strong> 1.1892...<br>3. <strong>Round:</strong> 1.19"
        },

        // --- LEVEL 5: REAL NUMBER SORTING ---
        {
            q: "<strong>Identify:</strong><br>0.3333...<br><span style='font-size:0.6em'>(Type 1=Rational, 0=Irrational)</span>",
            a: 1,
            level: "Real Numbers",
            style: "lvl-real",
            steps: "1. <strong>Rule:</strong> Repeating pattern (bar) = Good.<br>2. <strong>Result:</strong> Rational (It's 1/3)."
        },
        {
            q: "<strong>Identify:</strong><br>√5<br><span style='font-size:0.6em'>(Type 1=Rational, 0=Irrational)</span>",
            a: 0,
            level: "Real Numbers",
            style: "lvl-real",
            steps: "1. <strong>Rule:</strong> Root of a Prime Number.<br>2. <strong>Result:</strong> Irrational (Chaos)."
        },
        {
            q: "<strong>The Boss:</strong><br>0.101001000...<br><span style='font-size:0.6em'>(Type 1=Rational, 0=Irrational)</span>",
            a: 0,
            level: "Real Numbers",
            style: "lvl-real",
            steps: "1. <strong>Trap:</strong> The pattern <em>changes</em> (adds more zeros).<br>2. <strong>Result:</strong> Irrational (No fixed pattern)."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let streak = 0;

    function loadQuestion() {
        const gameArea = document.getElementById('game-area');
        const feedbackArea = document.getElementById('feedback-area');
        const progressBar = document.getElementById('progress-bar');
        const problemBox = document.getElementById('problem-box');

        // Reset UI
        feedbackArea.style.display = 'none';
        feedbackArea.innerHTML = '';
        gameArea.style.display = 'block';
        problemBox.classList.remove('shake', 'pulse');
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        // Check for Win
        if(currentIdx >= questions.length) {
            gameArea.innerHTML = `
                <h2>👑 REAL NUMBER GOD 👑</h2>
                <div style="font-size: 3rem; margin: 20px;">♾️</div>
                <p>Final XP: ${score} / ${questions.length}</p>
                <p>Max Streak: ${streak}</p>
                <button onclick="location.reload()">Prestige (Restart)</button>
            `;
            progressBar.style.width = '100%';
            document.getElementById('level-display').innerText = "MAX";
            return;
        }

        // Load Question
        const q = questions[currentIdx];
        document.getElementById('problem-box').innerHTML = `
            <span class="level-badge ${q.style}">${q.level}</span>
            <div style="margin-top:10px">${q.q}</div>
        `;
        
        // Update Stats
        const percent = (currentIdx / questions.length) * 100;
        progressBar.style.width = `${percent}%`;
        document.getElementById('level-display').innerText = Math.floor((currentIdx/3) + 1);

        // Update Tip based on level
        const tipText = document.getElementById('tip-text');
        if(q.level === "Number Line") {
            tipText.innerText = "Tip: Percent ÷ 100. Fractions = Top ÷ Bottom.";
        } else if (q.level === "Real Numbers") {
            tipText.innerText = "Tip: Changing Pattern = Irrational. Repeating Pattern = Rational.";
        } else if (q.level.includes("Tile")) {
            tipText.innerText = "Tip: Red = (+1), Blue = (-1). A pair destroys both.";
        } else {
            tipText.innerText = "Tip: (-3)² is 9. But -3² is -9.";
        }
    }

    function checkAnswer() {
        const inputEl = document.getElementById('answer-input');
        // V4.0 Change: Use parseFloat to handle decimals
        const userAns = parseFloat(inputEl.value);
        const feedbackArea = document.getElementById('feedback-area');
        const currentQ = questions[currentIdx];
        const gameArea = document.getElementById('game-area');
        const problemBox = document.getElementById('problem-box');

        if (isNaN(userAns)) {
            problemBox.classList.add('shake');
            setTimeout(() => problemBox.classList.remove('shake'), 500);
            return;
        }

        // Hide input area
        gameArea.style.display = 'none';
        feedbackArea.style.display = 'block';

        let isCorrect = userAns === currentQ.a;
        let feedbackHTML = '';

        if(isCorrect) {
            score++;
            streak++;
            problemBox.classList.add('pulse'); 
            feedbackHTML = `
                <div class="feedback-card correct">
                    <h3>✅ Critical Hit!</h3>
                    <p>${currentQ.steps}</p>
                    <button onclick="nextQuestion()">Next Level >></button>
                </div>
            `;
        } else {
            streak = 0;
            problemBox.classList.add('shake'); 
            feedbackHTML = `
                <div class="feedback-card incorrect">
                    <h3>❌ Damage Taken</h3>
                    <p><strong>Your answer:</strong> ${userAns}</p>
                    <p><strong>Correct answer:</strong> ${currentQ.a}</p>
                    <hr>
                    <p>${currentQ.steps}</p>
                    <button onclick="nextQuestion()">Recover & Continue >></button>
                </div>
            `;
        }

        feedbackArea.innerHTML = feedbackHTML;
        
        // Update Stats
        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    // Start Game
    loadQuestion();
</script>

</body>
</html>
